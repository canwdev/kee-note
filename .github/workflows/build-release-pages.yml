name: Build, Pre-release & Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & pre-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Read version and repo name
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Prepare zip and Pages files
        run: |
          touch dist/.nojekyll
          zip -r kee-note-web.zip dist
          ls -lh kee-note-web.zip

      - name: Create pre-release with dist zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-pre.${{ github.run_number }}
          name: KeeNote v${{ steps.meta.outputs.version }} (pre-release ${{ github.run_number }})
          body: |
            Automated pre-release build from `${{ github.sha }}` on `master`.

            Downloads:
            - `kee-note-web.zip` — production bundle (contains the `dist/` directory)

            Live preview: https://${{ github.repository_owner }}.github.io/${{ steps.meta.outputs.repo }}/
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: frontend/kee-note-web.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
